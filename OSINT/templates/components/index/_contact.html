{% load static %}


<section class=" padding-top-120" id="contact-section">
    <div class="container">
        <div class="home-contact">
            <h2 class="text-center">Contact With Us</h2>
            <p class="text-center">Drop Us a Line</p>
        </div>
        <div class="row justify-content-center form-row">
            <div class="col-lg-9">

                <form id="contact-form" action="{% url 'comment' %}" method="post">
                    {% csrf_token %}
                    <div class="row contact-form-wrap justify-content-center">
                        <div class="col-md-6 contact-name form-col">
                            <input name="name" id="name" class="form-control" type="text" placeholder="Name*"
                                   onfocus="this.placeholder=''" onblur="this.placeholder='Name*'">
                        </div>
                        <div class="col-md-6 contact-email form-col">
                            <input name="email" id="email" class="form-control" type="email" placeholder="E-mail*"
                                   onfocus="this.placeholder=''" onblur="this.placeholder='Email*'">
                        </div>
                        <div class="col-lg-12">
                                <textarea name="message" id="message" class="form-control" rows="8"
                                          placeholder="Message"
                                          onfocus="this.placeholder=''" onblur="this.placeholder='Message*'"></textarea>
                        </div>

                        <input type="submit" class="primary-btn" value="Send Message">
                        <div id="msg" class="message"></div>

                    </div>
                </form>

            </div>
        </div>
    </div>
</section>
